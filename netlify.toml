[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Sito statico (next.config.js -> output: 'export') + due funzioni serverless
# minime in netlify/functions/ per verificare gli acquisti Stripe e servire il
# contenuto protetto dei livelli. Nessun plugin Netlify per Next.js necessario:
# le funzioni sono indipendenti dall'export statico del sito.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
